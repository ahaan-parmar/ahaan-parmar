<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-label="gqlpwn">
  <title>gqlpwn</title>
  <style>
    .h{font:italic 400 28px 'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;fill:#cdd6f4}
    .p{font:400 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;fill:#a6adc8}
    .s{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;fill:#cba6f7}
    .t{font:600 12px 'JetBrains Mono','Cascadia Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .card{opacity:0;animation:in .8s 0.15s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .dot{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
  </style>
  <g class="card">
    <rect x=".5" y=".5" width="419" height="229" rx="20" fill="#1e1e2e" stroke="#cba6f7" stroke-opacity=".35"/>
    <circle class="dot" cx="386" cy="44" r="6" fill="#cba6f7"/>
    <text x="28" y="56" class="h">gqlpwn</text>
    <text x="28" y="98" class="p">A low-noise GraphQL and AppSync scanner</text><text x="28" y="120" class="p">with exploit oracles for seven vuln</text><text x="28" y="142" class="p">classes, from SSTI to cross-tenant IDOR.</text>
    <text x="28" y="172" class="s">Command injection confirmed at ~50x signal</text>
    <rect x="28" y="190" width="66" height="24" rx="12" fill="#cba6f7" fill-opacity=".14"/><text x="61" y="206" text-anchor="middle" class="t" fill="#cba6f7">Python</text><rect x="102.4" y="190" width="74" height="24" rx="12" fill="#cba6f7" fill-opacity=".14"/><text x="139" y="206" text-anchor="middle" class="t" fill="#cba6f7">GraphQL</text><rect x="184.20000000000002" y="190" width="74" height="24" rx="12" fill="#cba6f7" fill-opacity=".14"/><text x="221" y="206" text-anchor="middle" class="t" fill="#cba6f7">AppSync</text>
  </g>
</svg>
