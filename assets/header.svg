<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="Ahaan Parmar">
  <title>Ahaan Parmar</title>
  <style>
    .b0{animation:d0 14s ease-in-out infinite alternate}@keyframes d0{to{transform:translate(60px,30px)}}.b1{animation:d1 18s ease-in-out infinite alternate}@keyframes d1{to{transform:translate(-50px,-40px)}}.b2{animation:d2 16s ease-in-out infinite alternate}@keyframes d2{to{transform:translate(-70px,40px)}}.b3{animation:d3 20s ease-in-out infinite alternate}@keyframes d3{to{transform:translate(40px,-30px)}}.b4{animation:d4 22s ease-in-out infinite alternate}@keyframes d4{to{transform:translate(50px,-20px)}}
    .k{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;letter-spacing:4px;fill:#cba6f7}
    .n{font:italic 400 64px 'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;fill:#cdd6f4}
    .r{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;fill:#a6adc8;opacity:0;animation:rot 10.5s infinite}
    @keyframes rot{0%{opacity:0}4.0%{opacity:1}28.3%{opacity:1}33.3%,100%{opacity:0}}
    .in{opacity:0;animation:in 1.2s .2s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  </style>
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="card"><rect width="880" height="280" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="280" fill="#1e1e2e"/>
    <g filter="url(#soft)"><circle class="b0" cx="140" cy="70" r="150" fill="#f5c2e7" opacity=".7"/><circle class="b1" cx="420" cy="250" r="170" fill="#cba6f7" opacity=".7"/><circle class="b2" cx="760" cy="60" r="160" fill="#fab387" opacity=".7"/><circle class="b3" cx="650" cy="260" r="130" fill="#94e2d5" opacity=".7"/><circle class="b4" cx="60" cy="260" r="110" fill="#89b4fa" opacity=".7"/></g>
    <rect width="880" height="280" fill="#1e1e2e" opacity=".22"/>
  </g>
  <g class="in">
    <text class="k" x="440" y="92" text-anchor="middle">HELLO, I'M</text>
    <text class="n" x="440" y="160" text-anchor="middle">Ahaan Parmar</text>
  </g>
  <text class="r" x="440" y="200" text-anchor="middle" style="animation-delay:0.0s">breaks things so they ship stronger</text><text class="r" x="440" y="200" text-anchor="middle" style="animation-delay:3.5s">pentester, ctf player, bug bounty hunter</text><text class="r" x="440" y="200" text-anchor="middle" style="animation-delay:7.0s">hunting bugs in graphql and aws</text>
</svg>
