<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-label="AD Attack Lab">
  <title>AD Attack Lab</title>
  <style>
    .h{font:italic 400 28px 'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;fill:#cdd6f4}
    .p{font:400 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;fill:#a6adc8}
    .s{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;fill:#fab387}
    .t{font:600 12px 'JetBrains Mono','Cascadia Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .card{opacity:0;animation:in .8s 0.30s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .dot{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
  </style>
  <g class="card">
    <rect x=".5" y=".5" width="419" height="229" rx="20" fill="#1e1e2e" stroke="#fab387" stroke-opacity=".35"/>
    <circle class="dot" cx="386" cy="44" r="6" fill="#fab387"/>
    <text x="28" y="56" class="h">AD Attack Lab</text>
    <text x="28" y="98" class="p">An isolated Windows domain to practise on.</text><text x="28" y="120" class="p">Responder, ntlmrelayx and mitm6 chained</text><text x="28" y="142" class="p">together, paths mapped in BloodHound.</text>
    <text x="28" y="172" class="s">Ends in Domain Admin</text>
    <rect x="28" y="190" width="81" height="24" rx="12" fill="#fab387" fill-opacity=".14"/><text x="69" y="206" text-anchor="middle" class="t" fill="#fab387">Impacket</text><rect x="117.2" y="190" width="96" height="24" rx="12" fill="#fab387" fill-opacity=".14"/><text x="165" y="206" text-anchor="middle" class="t" fill="#fab387">BloodHound</text>
  </g>
</svg>
