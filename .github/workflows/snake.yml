name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ea76cb&color_dots=#eff1f5,#e6d9fb,#d4bdf7,#b993f0,#8839ef
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f5c2e7&color_dots=#313244,#4b3f6b,#7a63a8,#a68bd8,#cba6f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
